[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rkakf"
version = "1.0.0"
authors = [
  { name = "Ahmed Sattar Jabbar", email = "ahmed.state.me@gmail.com" },
  { name = "Haifa Taha Abd Ahmed", email = "haefaa_adm@uomustansiriyah.edu.iq" },
]
description = "A Cubic-Decay Recursive Kurtosis-Aware Kalman Filter (RKAKF) for Bypassing Structural Blindness"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
]

[project.urls]
"Homepage" = "https://github.com/amjed-droid/RKAKF"
"Repository" = "https://github.com/amjed-droid/RKAKF"

[tool.setuptools.packages.find]
where = ["."]
include = ["rkakf*"]
